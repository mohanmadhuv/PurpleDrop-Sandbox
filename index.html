<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — Design for pioneers</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1733;
    --muted: #767e91;
    --line: rgba(0, 0, 0, 0.1);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    padding: clamp(1.5rem, 4vw, 3rem);
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(0.7rem, 1.4vw, 0.85rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding-bottom: 0.35em;
    border-bottom: 1px solid var(--line);
    animation: fade-up 0.6s cubic-bezier(0.19, 1, 0.22, 1) both;
  }

  .headline-stage {
    position: relative;
    width: 100%;
    height: clamp(280px, 72vh, 900px);
    animation: slide-up 0.6s cubic-bezier(0.19, 1, 0.22, 1) both;
    animation-delay: 120ms;
  }

  .headline-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.4s cubic-bezier(0.19, 1, 0.22, 1);
  }

  /* visually-hidden but accessible heading */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .noscript-headline {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(2.5rem, 9vw, 6.5rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .subtext {
    max-width: 40ch;
    margin: 0;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    line-height: 1.6;
    color: var(--muted);
    animation: fade-up 0.6s cubic-bezier(0.19, 1, 0.22, 1) both;
    animation-delay: 360ms;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slide-up {
    from { transform: translateY(6px); }
    to   { transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow,
    .headline-stage,
    .subtext {
      animation: none;
    }
    #headline-canvas {
      transition: none;
    }
  }

  /* ── Concept pages ── */
  .concept-page {
    display: none;
    min-height: 100svh;
  }
  .concept-page.active {
    display: block;
  }

  /* ── Tab switcher ── */
  .concept-switcher {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 2px;
    background: #1c1c1f;
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2);
    z-index: 9999;
    user-select: none;
  }

  .cs-tab {
    border: none;
    background: transparent;
    color: #9e9eab;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    padding: 6px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.18s ease, background 0.18s ease;
    white-space: nowrap;
    line-height: 1;
  }

  .cs-tab:hover {
    color: #e2e2e8;
  }

  .cs-tab.cs-active {
    background: #e8e8ed;
    color: #1c1c1f;
  }

  .cs-divider {
    width: 1px;
    height: 18px;
    background: rgba(255,255,255,0.1);
    margin: 0 2px;
    flex-shrink: 0;
  }

  .cs-refresh {
    border: none;
    background: transparent;
    color: #9e9eab;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    transition: color 0.18s ease, transform 0.3s ease;
  }

  .cs-refresh:hover {
    color: #e2e2e8;
    transform: rotate(30deg);
  }
</style>
</head>
<body>

<!-- Concept 1: blank -->
<div id="page-1" class="concept-page"></div>

<!-- Concept 2: blank -->
<div id="page-2" class="concept-page"></div>

<!-- Concept 3: current design -->
<div id="page-3" class="concept-page active">
<main class="hero">
  <div class="headline-stage">
    <h1 class="sr-only">Design for pioneers</h1>
    <canvas id="headline-canvas" aria-hidden="true"></canvas>
    <noscript>
      <div class="noscript-headline">Design for<br />Pioneers</div>
    </noscript>
  </div>

</main>
</div><!-- /page-3 -->

<!-- Tab switcher -->
<nav class="concept-switcher" aria-label="Concept switcher">
  <button class="cs-tab" data-page="1">Concept 1</button>
  <button class="cs-tab" data-page="2">Concept 2</button>
  <button class="cs-tab cs-active" data-page="3">Concept 3</button>
  <div class="cs-divider"></div>
  <button class="cs-refresh" id="cs-refresh" title="Reload concept" aria-label="Reload">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M13.65 2.35A8 8 0 1 0 15 8h-2a6 6 0 1 1-1.76-4.24L9 6h6V0l-1.35 2.35z" fill="currentColor"/>
    </svg>
  </button>
</nav>

<script>
(function () {
  var tabs = document.querySelectorAll(".cs-tab");
  var pages = document.querySelectorAll(".concept-page");

  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      var target = tab.getAttribute("data-page");
      tabs.forEach(function (t) { t.classList.remove("cs-active"); });
      tab.classList.add("cs-active");
      pages.forEach(function (p) {
        p.classList.toggle("active", p.id === "page-" + target);
      });
    });
  });

  document.getElementById("cs-refresh").addEventListener("click", function () {
    window.location.reload();
  });
})();
</script>

<script>
(function () {
  var canvas = document.getElementById("headline-canvas");
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext("2d");
  var stage = canvas.parentElement;

  var reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  var CHARS = "PURPLEDROP";
  var LINES = ["Design for", "Pioneers"];

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var width = 0,
    height = 0,
    cellSize = 0,
    charSize = 0,
    cols = 0,
    rows = 0,
    mask = null,
    cellOffsets = null,
    rowSeqs = null;
  var time = 0;
  var rafId = null;

  // Magnetic repulsion state — two shared globals drive all cells in lockstep
  var mouseX = null, mouseY = null;
  var smoothMouseX = null, smoothMouseY = null;
  var fieldPresence = 0;   // 0 = no field, 1 = full field
  var REPEL_RADIUS = 120;  // influence radius in CSS px
  var MAX_PUSH = 0;        // set in setup() as 2.5 × cellSize
  var MOUSE_LERP = 0.18;   // how fast smooth cursor tracks real cursor
  var PRESENCE_IN = 0.12;  // field build rate when cursor is over canvas
  var PRESENCE_OUT = 0.86; // field decay multiplier per frame when cursor leaves

  function fitFontSize(cssWidth, cssHeight) {
    var probe = document.createElement("canvas").getContext("2d");
    var fSize = cssHeight * 0.4;
    for (var i = 0; i < 24; i++) {
      probe.font = '800 ' + fSize + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
      var maxLineWidth = 0;
      for (var j = 0; j < LINES.length; j++) {
        maxLineWidth = Math.max(maxLineWidth, probe.measureText(LINES[j]).width);
      }
      if (maxLineWidth <= cssWidth * 0.97) break;
      fSize *= 0.94;
    }
    return fSize;
  }

  function buildMask(cssWidth, cssHeight, fSize) {
    var off = document.createElement("canvas");
    off.width = cssWidth;
    off.height = cssHeight;
    var octx = off.getContext("2d");
    // leave the background transparent (alpha 0) so glyph coverage
    // can be read from the alpha channel alone
    octx.clearRect(0, 0, cssWidth, cssHeight);
    octx.fillStyle = "#fff";
    octx.textAlign = "left";
    octx.textBaseline = "middle";
    octx.font = '800 ' + fSize + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    if ("letterSpacing" in octx) octx.letterSpacing = (-0.02 * fSize).toFixed(1) + "px";

    var lineHeight = fSize * 0.8;
    var totalHeight = lineHeight * LINES.length;
    var y = cssHeight / 2 - totalHeight / 2 + lineHeight / 2;
    for (var i = 0; i < LINES.length; i++) {
      octx.fillText(LINES[i], 0, y);
      y += lineHeight;
    }
    return octx.getImageData(0, 0, cssWidth, cssHeight);
  }

  function setup() {
    var rect = stage.getBoundingClientRect();
    width = Math.max(1, Math.round(rect.width));
    height = Math.max(1, Math.round(rect.height));

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var fontSize = fitFontSize(width, height);

    // size the grid off the fitted letter size (not raw viewport width) so
    // the character-to-stroke-width ratio stays constant at every screen
    // size instead of going coarse on small viewports; characters are
    // capped small (6px) and packed tight so the grid resolves the
    // letterforms cleanly instead of blocking up
    charSize = Math.min(7, Math.max(3, Math.round(fontSize * 0.08)));
    if (width < 768) charSize = Math.max(2, Math.round(charSize * 0.6));
    cellSize = Math.min(charSize, Math.max(2, Math.round(charSize * 0.85)));
    cols = Math.max(1, Math.ceil(width / cellSize));
    rows = Math.max(1, Math.ceil(height / cellSize));

    var imgData = buildMask(width, height, fontSize);

    // average alpha coverage over each cell's pixel block (not a single
    // sample point) so thin serif strokes don't fall through the grid
    mask = new Uint8Array(cols * rows);
    var pixels = imgData.data;
    for (var r = 0; r < rows; r++) {
      var y0 = r * cellSize;
      var y1 = Math.min(height, y0 + cellSize);
      for (var c = 0; c < cols; c++) {
        var x0 = c * cellSize;
        var x1 = Math.min(width, x0 + cellSize);
        var sum = 0,
          count = 0;
        for (var y = y0; y < y1; y++) {
          var rowOffset = y * width;
          for (var x = x0; x < x1; x++) {
            sum += pixels[(rowOffset + x) * 4 + 3];
            count++;
          }
        }
        var avgAlpha = count > 0 ? sum / count : 0;
        mask[r * cols + c] = avgAlpha > 22 ? 1 : 0;
      }
    }

    // Build per-row sequences: stream PURPLEDROP continuously but inject
    // a single-cell space at ~12% of positions, chosen independently per
    // row, so breaks land mid-word at unpredictable spots.
    var charCount = CHARS.length;
    var seqLen = Math.max(240, cols * 4);
    rowSeqs = [];
    cellOffsets = new Uint32Array(rows);
    for (var i = 0; i < rows; i++) {
      var seq = new Array(seqLen);
      var ci = 0;
      for (var j = 0; j < seqLen; j++) {
        if (Math.random() < 0.05) {
          seq[j] = null; // gap
        } else {
          seq[j] = CHARS[ci % charCount];
          ci++;
        }
      }
      rowSeqs.push(seq);
      cellOffsets[i] = Math.floor(Math.random() * seqLen);
    }

    ctx.font = '600 ' + charSize + 'px "IBM Plex Mono", monospace';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    MAX_PUSH = cellSize * 2.5;
  }

  function updatePhysics() {
    if (mouseX !== null) {
      if (smoothMouseX === null) {
        smoothMouseX = mouseX;
        smoothMouseY = mouseY;
      } else {
        smoothMouseX += (mouseX - smoothMouseX) * MOUSE_LERP;
        smoothMouseY += (mouseY - smoothMouseY) * MOUSE_LERP;
      }
      fieldPresence += (1 - fieldPresence) * PRESENCE_IN;
    } else {
      fieldPresence *= PRESENCE_OUT;
      if (fieldPresence < 0.001) {
        fieldPresence = 0;
        smoothMouseX = null;
        smoothMouseY = null;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    var charCount = CHARS.length;
    var scrollOffset = Math.floor(time * 8);

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (!mask[r * cols + c]) continue;

        var nx = cols > 1 ? (c / (cols - 1)) * 2 - 1 : 0; // -1..1 across width

        var seq = rowSeqs[r];
        var pos = (cellOffsets[r] + c + scrollOffset) % seq.length;
        var ch = seq[pos];
        if (!ch) continue; // gap — skip cell

        // horizontal gradient: #B9A4F7 (hsl 255,84%,81%) left → #8A85E5 (hsl 243,65%,71%) right
        var t = (nx + 1) / 2;
        var hue = 255 - t * 12;
        var sat = 84 - t * 19;
        var light = 81 - t * 10;
        var color = "hsl(" + hue + " " + sat + "% " + light + "% / 1)";

        var ox = 0, oy = 0;
        if (smoothMouseX !== null && fieldPresence > 0.001) {
          var cx = c * cellSize + cellSize / 2;
          var cy = r * cellSize + cellSize / 2;
          var dx = cx - smoothMouseX;
          var dy = cy - smoothMouseY;
          var dist2 = dx * dx + dy * dy;
          var r2 = REPEL_RADIUS * REPEL_RADIUS;
          if (dist2 < r2 && dist2 > 0.0001) {
            var dist = Math.sqrt(dist2);
            var norm = 1 - dist / REPEL_RADIUS;
            var strength = norm * norm * MAX_PUSH * fieldPresence;
            ox = (dx / dist) * strength;
            oy = (dy / dist) * strength;
          }
        }
        ctx.fillStyle = color;
        ctx.fillText(ch, c * cellSize + cellSize / 2 + ox, r * cellSize + cellSize / 2 + oy);
      }
    }
  }

  function frame() {
    time += 0.01;
    updatePhysics();
    draw();
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    setup();
    draw();
    canvas.style.opacity = "1";
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    if (!reduceMotion) {
      rafId = requestAnimationFrame(frame);
    }
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      start();
    }, 150);
  });

  canvas.addEventListener("mousemove", function (e) {
    var rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });
  canvas.addEventListener("mouseleave", function () {
    mouseX = null;
    mouseY = null;
  });

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 16px "IBM Plex Mono"')
    ])
      .then(start)
      .catch(start);
  } else {
    start();
  }
})();
</script>

</body>
</html>
